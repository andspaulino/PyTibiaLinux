[tool.poetry]
name = "pytibia-linux"
version = "0.1.0"
description = "Adaptação do PyTibia para Linux"
authors = ["PyTibia Linux contributors"]
package-mode = false

[tool.poetry.dependencies]
python = "3.11.7"
cityhash = "^0.4.7"
mss = "^10.2.0"
nptyping = "^2.5.0"
numpy = "1.26.2"
opencv-python = "^4.6.0.66"
pillow = "^9.1.1"
numba = "^0.58.1"

[tool.poetry.group.test.dependencies]
pytest = "^7.1.3"
pytest-cov = "^4.0.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
